[project]
name = "psp_2d_game"
title = "PSP 2D Starter"
id = "ULUS00001"
version = "1.0.0"

[build]
entry = "src/main.c"
opt_level = "-O2"
alloc_heap_mb = 20

[assets]
input_dir = "assets"
output_dir = "build/assets"
autowatch = true

[deploy]
emulator_bin = "PPSSPPQt"
icon = "assets/icon0.png"
background = "assets/pic1.png"
