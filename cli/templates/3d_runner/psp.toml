[project]
name = "psp_3d_runner"
title = "PSP 3D Runner"
id = "ULUS00002"
version = "1.0.0"

[build]
entry = "src/main.c"
opt_level = "-O2"
alloc_heap_mb = 20

[assets]
input_dir = "assets"
output_dir = "build/assets"
autowatch = true

[deploy]
emulator_bin = "PPSSPPQt"
icon = "assets/icon0.png"
background = "assets/pic1.png"
